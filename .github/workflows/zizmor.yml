name: 🛡️ Zizmor
run-name: 🛡️ Zizmor

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: 🛡️ Audit Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout workflow files to audit
      security-events: write # upload SARIF findings to code-scanning
      actions: read # let zizmor resolve workflow references
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 🛡️ Run Zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          persona: regular
          min-severity: low
          min-confidence: medium
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
